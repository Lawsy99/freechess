<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the full iPhone screen, including around the notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FreeChess</title>
    <meta name="theme-color" content="#16181d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iPhone home-screen app: opens full screen, with its own icon and name -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FreeChess" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- What a shared link shows in Messages, WhatsApp and so on -->
    <meta name="description" content="Free chess, all of it. Play bots from beginner to master, get coached, solve unlimited puzzles and learn step by step. No subscription." />
    <meta property="og:title" content="FreeChess" />
    <meta property="og:description" content="Free chess, all of it. Play bots from beginner to master, get coached, solve unlimited puzzles and learn step by step. No subscription." />
    <meta property="og:image" content="https://lawsy99.github.io/freechess/icon-512.png" />
    <meta property="og:url" content="https://lawsy99.github.io/freechess/" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
